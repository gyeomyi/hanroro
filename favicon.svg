<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 사이트의 중심 모티프 0 + 0 = ∞ 를 16px에서도 읽히게 줄인 것.
       자몽 고리와 살구 고리가 겹쳐 무한대가 된다. 먹밤 바탕은 밝은 탭에서도 버티라고. -->
  <rect width="32" height="32" rx="7" fill="#13141b"/>
  <g fill="none" stroke-width="3.2">
    <circle cx="11.8" cy="16" r="6.8" stroke="#e05a7a"/>
    <circle cx="20.2" cy="16" r="6.8" stroke="#f0a45c"/>
  </g>
</svg>
